aid: mobagel
name: Mobagel
description: >-
  MoBagel is an AI and automated machine learning (AutoML) company founded in
  2015 and headquartered in San Jose, California, with offices across seven
  global locations. Its flagship Decanter AI platform lets business users build
  machine learning models and generate predictions without a data science
  background, spanning AutoML, automated time-series forecasting (AutoTSF),
  MLOps, DataOps, and a generative-BI suite (Generative BI, Generative ETL,
  Generative Expert) now surfaced through the 8ndpoint product and a family of
  vertical AI agents for marketing, supply chain, finance, and manufacturing.
  MoBagel exposes Decanter AI programmatically through an official first-party
  Python SDK (decanter-ai-sdk) that authenticates with an API key and drives
  data upload, model training, and prediction. Backed by 500 Global.
